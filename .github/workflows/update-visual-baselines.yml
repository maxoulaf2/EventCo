name: Update visual baselines

# Déclenchement manuel uniquement : régénère les captures de référence de la
# non-régression visuelle dans le même environnement Docker (Linux) que la CI,
# jamais en local (cf. conventions-code.md §2.3 — le rendu des fonts diffère
# selon l'OS). Le résultat est poussé sur une branche dédiée et ouvre (ou met à
# jour) une Pull Request pour comparer visuellement et merger facilement.
on:
  workflow_dispatch: {}

jobs:
  regenerate-screenshots:
    name: Régénère les captures de référence
    runs-on: ubuntu-latest
    # git est présent dans cette image (contrairement à gh) : suffisant pour ce job,
    # la partie Pull Request tourne dans le job suivant sur un runner nu.
    container: mcr.microsoft.com/playwright:v1.62.1-jammy
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Regenerate screenshots
        working-directory: client
        run: npm run test:visual:update

      - name: Upload updated screenshots
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: client/tests/visual/__screenshots__/
          retention-days: 15

  open-pull-request:
    name: Ouvre la Pull Request
    needs: regenerate-screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # Repart d'un dossier vide avant d'extraire l'artefact : une capture supprimée côté
      # regénération (scénario retiré) doit apparaître comme suppression dans le diff Git,
      # pas rester orpheline.
      - name: Reset screenshots directory
        run: rm -rf client/tests/visual/__screenshots__

      - name: Download updated screenshots
        uses: actions/download-artifact@v8
        with:
          name: visual-baselines
          path: client/tests/visual/__screenshots__

      - name: Check for changes
        id: changes
        run: |
          if git status --porcelain -- client/tests/visual/__screenshots__ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="chore/update-visual-baselines"
          git checkout -B "$branch"
          git add client/tests/visual/__screenshots__
          git commit -m "Met à jour les captures de référence (non-régression visuelle)"
          git push --force origin "$branch"

          # Réutilise une PR déjà ouverte sur cette branche (le push ci-dessus l'a déjà mise
          # à jour) ; en ouvre une nouvelle sinon, y compris si une précédente a été fermée/mergée.
          state=$(gh pr view "$branch" --json state -q .state 2>/dev/null || echo "NONE")
          if [ "$state" != "OPEN" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Met à jour les captures de référence (non-régression visuelle)" \
              --body "Captures régénérées automatiquement par le workflow *Update visual baselines*, dans la même image Docker Playwright que la CI. À comparer visuellement avant de merger."
          fi

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "Aucune différence détectée, pas de Pull Request à créer."
